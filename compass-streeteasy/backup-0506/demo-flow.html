<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Your Inquiry Gets Answered — Automatically</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 0 0 8px;
    text-align: center;
    letter-spacing: -0.3px;
  }
  p.sub {
    font-size: 14px;
    color: #888;
    margin: 0 0 32px;
    text-align: center;
  }
  svg { max-width: 860px; width: 100%; }
</style>
</head>
<body>

<h1>How Your Inquiry Gets Answered — Automatically</h1>
<p class="sub">From the moment a renter reaches out, to the moment your agent connects.</p>

<svg viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How Your Inquiry Gets Answered — Automatically</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Column headers -->
<rect x="40" y="20" width="180" height="36" rx="8" fill="#D85A30"/>
<text font-size="14" font-weight="600" x="130" y="38" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Renter</text>

<rect x="250" y="20" width="180" height="36" rx="8" fill="#444441"/>
<text font-size="14" font-weight="600" x="340" y="38" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Automated system</text>

<rect x="460" y="20" width="180" height="36" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<text font-size="14" font-weight="600" x="550" y="38" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Agent</text>

<!-- Dividers — darker and more visible -->
<line x1="235" y1="16" x2="235" y2="544" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="447" y1="16" x2="447" y2="544" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="6 4"/>

<!-- STEP 1 -->
<rect x="44" y="80" width="172" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="130" y="102" text-anchor="middle" dominant-baseline="central" fill="#712B13">Visits listing page</text>

<line x1="130" y1="124" x2="130" y2="148" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 2 -->
<rect x="44" y="148" width="172" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="130" y="170" text-anchor="middle" dominant-baseline="central" fill="#712B13">Fills tour request form</text>

<line x1="216" y1="170" x2="250" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 3 -->
<rect x="254" y="148" width="172" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="170" text-anchor="middle" dominant-baseline="central" fill="#444441">Sends notification email</text>

<line x1="426" y1="170" x2="460" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 4 -->
<rect x="464" y="148" width="172" height="44" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<text font-size="14" font-weight="500" x="550" y="170" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Receives inquiry</text>

<line x1="340" y1="192" x2="340" y2="226" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 5 -->
<rect x="254" y="226" width="172" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="248" text-anchor="middle" dominant-baseline="central" fill="#444441">Gmail labels email</text>

<line x1="340" y1="270" x2="340" y2="304" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 6 -->
<rect x="254" y="304" width="172" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="326" text-anchor="middle" dominant-baseline="central" fill="#444441">Make detects new email</text>

<line x1="340" y1="348" x2="340" y2="382" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 7 -->
<rect x="254" y="382" width="172" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="404" text-anchor="middle" dominant-baseline="central" fill="#444441">Sends auto-reply</text>

<line x1="254" y1="404" x2="216" y2="404" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 8 -->
<rect x="44" y="382" width="172" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="130" y="404" text-anchor="middle" dominant-baseline="central" fill="#712B13">Receives instant reply</text>

<line x1="130" y1="426" x2="130" y2="460" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 9 -->
<rect x="44" y="460" width="172" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="130" y="482" text-anchor="middle" dominant-baseline="central" fill="#712B13">Clicks REPLY to agent</text>

<line x1="216" y1="482" x2="460" y2="482" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STEP 10 -->
<rect x="464" y="460" width="172" height="44" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<text font-size="14" font-weight="500" x="550" y="482" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Follows up directly</text>

<!-- Agent no-action -->
<rect x="464" y="226" width="172" height="44" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<text font-size="14" font-weight="500" x="550" y="248" text-anchor="middle" dominant-baseline="central" fill="#185FA5">No action needed</text>

<line x1="550" y1="192" x2="550" y2="226" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

</svg>
</body>
</html>
